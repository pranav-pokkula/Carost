<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ParkShare - Home</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body onload="init()">
  <nav>
    <div class="logo">ParkShare</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="vehicles.html">Vehicles</a>
      <a href="login.html" id="login-link">Login</a>
      <a href="register.html" id="register-link">Register</a>
      <a href="dashboard.html" id="dashboard-link" style="display: none;">Dashboard</a>
      <a href="#" onclick="logout()" id="logout-link" style="display: none;">Logout</a>
    </div>
  </nav>

  <header>
    <h1>Welcome to ParkShare</h1>
    <p>The ultimate solution for car rental and parking efficiency.</p>
    <a href="register.html" class="btn">Get Started</a>
  </header>

  <main>
    <!-- Main content here -->
  </main>

  <footer>
    <p>&copy; 2023 ParkShare. All rights reserved.</p>
  </footer>

  <script>
    // Update navigation based on user authentication
    if (currentUser) {
      document.getElementById("login-link").style.display = "none";
      document.getElementById("register-link").style.display = "none";
      document.getElementById("dashboard-link").style.display = "inline-block";
      document.getElementById("logout-link").style.display = "inline-block";
    } else {
      document.getElementById("login-link").style.display = "inline-block";
      document.getElementById("register-link").style.display = "inline-block";
      document.getElementById("dashboard-link").style.display = "none";
      document.getElementById("logout-link").style.display = "none";
    }
  </script>
</body>
</html>
