name: Booking domain tests
on:
  push:
    branches: [main, "redesign/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run booking tests
        run: npm test
      - name: Check server syntax
        run: node --check backend/server.js
