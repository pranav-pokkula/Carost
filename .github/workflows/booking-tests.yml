name: Carost build and booking tests
on:
  push:
    branches: [main, "redesign/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm test
      - run: node --check backend/server.js
      - run: npm run build
      - name: Verify static dist
        run: |
          test -f dist/index.html
          test -f dist/marketplace.mjs
          test ! -e dist/login.html
          test ! -e dist/register.html
          test ! -e dist/app.js
